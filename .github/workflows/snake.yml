name: Generate Contribution Snake

on:
workflow_dispatch:
schedule:
- cron: "0 0 * * *"

permissions:
contents: write

jobs:
generate:
runs-on: ubuntu-latest

steps:
  - name: Generate Snake
    uses: Platane/snk@v3
    with:
      github_user_name: YugPatelStarDev
      outputs: |
        dist/github-contribution-grid-snake.svg
        dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300F7FF&color_dots=%23161B22%2C%236A00FF%2C%238A2BE2%2C%23FF00FF

  - name: Publish Snake
    uses: crazy-max/ghaction-github-pages@v4
    with:
      build_dir: dist
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_DIR: dist
